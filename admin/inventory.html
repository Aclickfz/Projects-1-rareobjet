<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory | Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-shell" id="app"></div>
  <script src="js/admin-common.js"></script>
  <script>
    (async () => {
      const { requireAdmin, nav, bindLogout, api, formatInr } = AdminApp;
      await requireAdmin();
      const { products } = await api('/api/admin/products');
      document.getElementById('app').innerHTML = `
        ${nav('inventory.html')}
        <main class="admin-main">
          <h2>Inventory</h2>
          <form class="admin-form" id="adjust" style="margin-bottom:24px">
            <label>Product
              <select name="product_id" required>
                ${products.map(p => `<option value="${p.id}">${p.name} (stock ${p.stock_qty})</option>`).join('')}
              </select>
            </label>
            <label>Change qty (+/-) <input type="number" name="change_qty" required></label>
            <label>Note <input name="note" placeholder="Received stock / damage…"></label>
            <button class="btn" type="submit">Adjust</button>
            <p class="admin-status" id="status"></p>
          </form>
          <table class="admin-table">
            <thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Price</th></tr></thead>
            <tbody>
              ${products.map(p => `<tr class="${p.stock_qty <= 5 ? 'low' : ''}">
                <td>${p.name}</td><td>${p.sku || '—'}</td><td>${p.stock_qty}</td><td>${formatInr(p.price)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </main>`;
      bindLogout();
      document.getElementById('adjust').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          await api('/api/admin/inventory/adjust', {
            method: 'POST',
            body: {
              product_id: Number(fd.get('product_id')),
              change_qty: Number(fd.get('change_qty')),
              note: fd.get('note')
            }
          });
          location.reload();
        } catch (err) {
          document.getElementById('status').textContent = err.message;
        }
      });
    })().catch(() => {});
  </script>
</body>
</html>
