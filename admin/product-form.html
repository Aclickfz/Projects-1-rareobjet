<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product form | Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-shell" id="app"></div>
  <script src="js/admin-common.js"></script>
  <script>
    (async () => {
      const { requireAdmin, nav, bindLogout, api } = AdminApp;
      await requireAdmin();
      const id = new URLSearchParams(location.search).get('id');
      const { categories } = await api('/api/admin/categories');
      let product = null;
      if (id) {
        const data = await api(`/api/products/${id}`);
        product = data.product;
      }

      document.getElementById('app').innerHTML = `
        ${nav('products.html')}
        <main class="admin-main">
          <h2>${id ? 'Edit' : 'Add'} product</h2>
          <form class="admin-form" id="form">
            <label>Name <input name="name" required value="${product?.name || ''}"></label>
            <label>Slug <input name="slug" value="${product?.slug || ''}"></label>
            <label>Price (INR) <input name="price" type="number" step="0.01" required value="${product?.price || ''}"></label>
            <label>Stock <input name="stock_qty" type="number" required value="${product?.stock_qty ?? 0}"></label>
            <label>SKU <input name="sku" value="${product?.sku || ''}"></label>
            <label>Badge <input name="badge" value="${product?.badge || ''}"></label>
            <label>Grade label <input name="grade_label" value="${product?.grade_label || ''}"></label>
            <label>Category
              <select name="category_id">
                <option value="">—</option>
                ${categories.map(c => `<option value="${c.id}" ${product?.category_id == c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
            </label>
            <label>Description <textarea name="description" rows="4">${product?.description || ''}</textarea></label>
            <label>Active
              <select name="is_active">
                <option value="1" ${!product || product.is_active ? 'selected' : ''}>Yes</option>
                <option value="0" ${product && !product.is_active ? 'selected' : ''}>No</option>
              </select>
            </label>
            <label>Images <input type="file" name="images" accept="image/*" multiple></label>
            ${product?.images?.length ? `<div>Current: ${product.images.map(i => i.path).join(', ')}</div>
              <input type="hidden" name="keep_images" value="1">
              ${product.images.map(i => `<input type="hidden" name="existing_images" value="${i.path}">`).join('')}` : ''}
            <button class="btn" type="submit">Save</button>
            <p class="admin-status" id="status"></p>
          </form>
        </main>`;
      bindLogout();

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const fd = new FormData(form);
        if (id) fd.append('replace_images', fd.getAll('images').some(f => f && f.size) || fd.get('keep_images') ? '1' : '0');
        try {
          if (id) await api(`/api/admin/products/${id}`, { method: 'PUT', body: fd, headers: {} });
          else await api('/api/admin/products', { method: 'POST', body: fd, headers: {} });
          location.href = 'products.html';
        } catch (err) {
          document.getElementById('status').textContent = err.message;
        }
      });
    })().catch(() => {});
  </script>
</body>
</html>
